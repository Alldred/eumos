name: MUL
mnemonic: mul
format: R
asm_format: default
fixed_values:
  opcode: 0x33
  funct3: 0x0
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
description: |
  MUL multiplies the values in rs1 and rs2 and writes the low XLEN bits to rd.
  rd = (rs1 * rs2)[XLEN-1:0]
