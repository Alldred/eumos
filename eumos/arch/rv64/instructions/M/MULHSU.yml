name: MULHSU
mnemonic: mulhsu
format: R
asm_format: default
fixed_values:
  opcode: 0x33
  funct3: 0x2
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
description: |
  MULHSU multiplies signed rs1 and unsigned rs2 and writes the upper XLEN bits to rd.
  rd = (signed(rs1) * unsigned(rs2))[2*XLEN-1:XLEN]
