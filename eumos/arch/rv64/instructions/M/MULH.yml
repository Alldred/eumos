name: MULH
mnemonic: mulh
format: R
asm_format: default
fixed_values:
  opcode: 0x33
  funct3: 0x1
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
description: |
  MULH multiplies signed rs1 and signed rs2 and writes the upper XLEN bits to rd.
  rd = (signed(rs1) * signed(rs2))[2*XLEN-1:XLEN]
