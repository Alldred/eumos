name: DIVW
mnemonic: divw
format: R
asm_format: default
fixed_values:
  opcode: 0x3B
  funct3: 0x4
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
description: |
  DIVW divides signed 32-bit rs1 by signed 32-bit rs2 and writes the sign-extended 32-bit quotient to rd.
  rd = sign_extend(signed(rs1[31:0]) / signed(rs2[31:0]))
