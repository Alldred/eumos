name: DIVW
mnemonic: divw
format: R
asm_format: default
fixed_values:
  opcode: 0x3B
  funct3: 0x4
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
behavior:
  arithmetic:
    operation: div
    result: quotient
    width: 32
    signed_operands: true
    rounding: toward_zero
    divide_by_zero: all_ones_then_sign_extend
    overflow:
      case: int_min_div_neg_one
      result: dividend_then_sign_extend
description: |
  DIVW performs signed 32-bit integer division with quotient rounded toward zero.
  If rs2[31:0] == 0, rd = sign_extend(0xFFFF_FFFF).
  If rs1[31:0] == 0x8000_0000 and rs2[31:0] == 0xFFFF_FFFF, rd = sign_extend(0x8000_0000).
  Otherwise, rd = sign_extend(trunc_toward_zero(signed(rs1[31:0]) / signed(rs2[31:0]))).
