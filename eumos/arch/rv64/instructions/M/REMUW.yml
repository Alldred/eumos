name: REMUW
mnemonic: remuw
format: R
asm_format: default
fixed_values:
  opcode: 0x3B
  funct3: 0x7
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
description: |
  REMUW divides unsigned 32-bit rs1 by unsigned 32-bit rs2 and writes the sign-extended 32-bit remainder to rd.
  rd = sign_extend(unsigned(rs1[31:0]) % unsigned(rs2[31:0]))
