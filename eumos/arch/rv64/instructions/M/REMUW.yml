name: REMUW
mnemonic: remuw
format: R
asm_format: default
fixed_values:
  opcode: 0x3B
  funct3: 0x7
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
behavior:
  arithmetic:
    operation: div
    result: remainder
    width: 32
    signed_operands: false
    rounding: toward_zero
    divide_by_zero: dividend_then_sign_extend
description: |
  REMUW computes the unsigned 32-bit remainder and sign-extends the 32-bit result to XLEN.
  If rs2[31:0] == 0, rd = sign_extend(rs1[31:0]).
  Otherwise, rd = sign_extend(unsigned(rs1[31:0]) % unsigned(rs2[31:0])).
