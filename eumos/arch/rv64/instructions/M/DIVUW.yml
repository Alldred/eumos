name: DIVUW
mnemonic: divuw
format: R
asm_format: default
fixed_values:
  opcode: 0x3B
  funct3: 0x5
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
behavior:
  arithmetic:
    operation: div
    result: quotient
    width: 32
    signed_operands: false
    rounding: toward_zero
    divide_by_zero: all_ones_then_sign_extend
description: |
  DIVUW performs unsigned 32-bit integer division with quotient rounded toward zero.
  If rs2[31:0] == 0, rd = sign_extend(0xFFFF_FFFF).
  Otherwise, rd = sign_extend(unsigned(rs1[31:0]) / unsigned(rs2[31:0])).
