name: DIVU
mnemonic: divu
format: R
asm_format: default
fixed_values:
  opcode: 0x33
  funct3: 0x5
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
description: |
  DIVU divides unsigned rs1 by unsigned rs2 and writes the quotient to rd.
  rd = unsigned(rs1) / unsigned(rs2)
