name: DIVU
mnemonic: divu
format: R
asm_format: default
fixed_values:
  opcode: 0x33
  funct3: 0x5
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
behavior:
  arithmetic:
    operation: div
    result: quotient
    width: xlen
    signed_operands: false
    rounding: toward_zero
    divide_by_zero: all_ones
description: |
  DIVU performs unsigned integer division with quotient rounded toward zero.
  If rs2 == 0, rd is all 1s.
  Otherwise, rd = unsigned(rs1) / unsigned(rs2).
