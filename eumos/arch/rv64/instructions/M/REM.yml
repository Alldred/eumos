name: REM
mnemonic: rem
format: R
asm_format: default
fixed_values:
  opcode: 0x33
  funct3: 0x6
  funct7: 0x01
inputs:
  - rd
  - rs1
  - rs2
extension: "M"
groups:
  - alu/arith
description: |
  REM divides signed rs1 by signed rs2 and writes the remainder to rd.
  rd = signed(rs1) % signed(rs2)
